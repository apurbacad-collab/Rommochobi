<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রম্যছবি | বুকিং পেজ</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Hind Siliguri', sans-serif;
    margin: 0;
    background: #fdfdfd;
}
header {
    background: #1a1a1a;
    color: #fff;
    padding: 50px 20px;
    text-align: center;
}
.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}
.slider-container {
    width: 100%;
    height: 400px;
    overflow: hidden;
    border-radius: 15px;
}
.slides { display: none; height:100%; }
.slides img { width:100%; height:100%; object-fit:cover; }

.order-form {
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}
.form-group { margin-bottom:18px; }
label { font-weight:bold; display:block; margin-bottom:6px; }
input, textarea {
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}
.submit-btn {
    background:#27ae60;
    color:#fff;
    padding:15px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    width:100%;
}
.submit-btn:hover { background:#1e8449; }
footer {
    background:#1a1a1a;
    color:#aaa;
    text-align:center;
    padding:30px;
    margin-top:50px;
}
</style>
</head>

<body>

<header>
<h1>আপনার সেরা মুহূর্তগুলো ফ্রেমবন্দি করুন</h1>
<p>Wedding & Event Photography</p>
</header>

<div class="container">

<div class="slider-container">
    <div class="slides"><img src="https://i.postimg.cc/QxHQ8RSh/Rommochobi-Package-03.png"></div>
    <div class="slides"><img src="https://i.postimg.cc/t4zW2p4V/Rommochobi-Package-02-(1).png"></div>
    <div class="slides"><img src="https://i.postimg.cc/ZY39w4fK/Rommochobi-Package-01.png"></div>
</div>

<section class="order-form">
<h2 style="text-align:center;color:#27ae60">বুকিং ফর্ম</h2>

<form id="telegramForm">

<div class="form-group">
<label>নাম</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>ফোন</label>
<input type="tel" id="phone" required>
</div>

<div class="form-group">
<label>হলুদ</label>
<input type="date" id="holudDate">
</div>

<div class="form-group">
<label>বিয়ে</label>
<input type="date" id="weddingDate">
</div>

<div class="form-group">
<label>রিসিপশন</label>
<input type="date" id="receptionDate">
</div>

<div class="form-group">
<label>ঠিকানা</label>
<textarea id="address" required></textarea>
</div>

<div class="form-group">
<label>বাজেট</label>
<input type="text" id="budget">
</div>

<button class="submit-btn" type="submit">বুকিং পাঠান</button>

</form>
</section>

</div>

<footer>
&copy; ২০২৬ রম্যছবি
</footer>

<script>
/* SLIDER */
let index = 0;
const slides = document.getElementsByClassName("slides");
function showSlides(){
    for(let i=0;i<slides.length;i++){
        slides[i].style.display="none";
    }
    index++;
    if(index>slides.length){index=1;}
    slides[index-1].style.display="block";
    setTimeout(showSlides,3000);
}
showSlides();

/* TELEGRAM FORM */
document.getElementById("telegramForm").addEventListener("submit",function(e){
    e.preventDefault();

    const BOT_TOKEN = "BOT_TOKEN_HERE";
    const CHAT_ID = "CHAT_ID_HERE";

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const holud = document.getElementById("holudDate").value;
    const wedding = document.getElementById("weddingDate").value;
    const reception = document.getElementById("receptionDate").value;
    const address = document.getElementById("address").value;
    const budget = document.getElementById("budget").value;

    let message =
`📸 নতুন বুকিং (রম্যছবি)

👤 নাম: ${name}
📞 ফোন: ${phone}

📅 হলুদ: ${holud || "নেই"}
📅 বিয়ে: ${wedding || "নেই"}
📅 রিসিপশন: ${reception || "নেই"}

📍 ঠিকানা: ${address}
💰 বাজেট: ${budget || "উল্লেখ নেই"}`;

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            chat_id:CHAT_ID,
            text:message
        })
    })
    .then(r=>{
        if(r.ok){
            alert("বুকিং সফলভাবে পাঠানো হয়েছে ✅");
            e.target.reset();
        }else{
            alert("Telegram error ❌");
        }
    })
    .catch(()=>alert("ইন্টারনেট সমস্যা"));
});
</script>

</body>
