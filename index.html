<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Booking Form</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}
.order-form{
    max-width:700px;
    margin:30px auto;
    background:#fff;
    padding:20px;
    border-radius:8px;
}
.form-group{
    margin-bottom:15px;
}
.form-group label{
    display:block;
    margin-bottom:5px;
}
.form-group input,
.form-group textarea{
    width:100%;
    padding:8px;
}
.event-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}
.submit-btn{
    width:100%;
    padding:12px;
    background:#27ae60;
    color:#fff;
    border:none;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<section class="order-form">
<h2 style="text-align:center;color:#27ae60;">বুকিং ফর্মটি পূরণ করুন</h2>

<form id="telegramForm">

<div class="form-group">
<label>আপনার নাম</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>ফোন নম্বর</label>
<input type="tel" id="phone" required>
</div>

<h3>ইভেন্ট নির্বাচন করুন</h3>

<div class="event-grid">
<div><label>হলুদ</label><input type="date" id="holudDate"></div>
<div><label>মেহেন্দি</label><input type="date" id="mehendiDate"></div>
<div><label>বিয়ে</label><input type="date" id="weddingDate"></div>
<div><label>রিসিপশন</label><input type="date" id="receptionDate"></div>
<div><label>এনগেজমেন্ট</label><input type="date" id="engagementDate"></div>
<div><label>বার্ষিকী</label><input type="date" id="anniversaryDate"></div>
<div><label>বার্থডে</label><input type="date" id="birthdayDate"></div>
<div><label>অন্নপ্রাশন</label><input type="date" id="annaprashanDate"></div>

<div>
<label>Others</label>
<input type="text" id="otherEventName" placeholder="ইভেন্ট নাম">
<input type="date" id="otherEventDate">
</div>
</div>

<div class="form-group">
<label>ঠিকানা</label>
<textarea id="address" required></textarea>
</div>

<div class="form-group">
<label>বাজেট</label>
<input type="text" id="budget">
</div>

<button class="submit-btn" type="submit">বুকিং কনফার্ম করুন</button>

</form>
</section>

<script>
document.getElementById("telegramForm").addEventListener("submit", function(e){
    e.preventDefault();

    const BOT_TOKEN = "8092928069:AAEmPnJtjmz2iVjECy-B-ESBAfc_Ah4Seho";
    const CHAT_ID = "7507021624";

    let events = "";

    function addEvent(name, date){
        if(date){
            events += `• ${name}: ${date}\n`;
        }
    }

    addEvent("হলুদ", holudDate.value);
    addEvent("মেহেন্দি", mehendiDate.value);
    addEvent("বিয়ে", weddingDate.value);
    addEvent("রিসিপশন", receptionDate.value);
    addEvent("এনগেজমেন্ট", engagementDate.value);
    addEvent("বার্ষিকী", anniversaryDate.value);
    addEvent("বার্থডে", birthdayDate.value);
    addEvent("অন্নপ্রাশন", annaprashanDate.value);

    if(otherEventName.value && otherEventDate.value){
        events += `• ${otherEventName.value}: ${otherEventDate.value}\n`;
    }

    if(events === ""){
        events = "কোনো ইভেন্ট নির্বাচন করা হয়নি";
    }

    let message = 
`📸 নতুন বুকিং এসেছে

👤 নাম: ${name.value}
📞 ফোন: ${phone.value}

📅 ইভেন্টসমূহ:
${events}

📍 ঠিকানা:
${address.value}

💰 বাজেট: ${budget.value || "উল্লেখ নেই"}`;

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message
        })
    })
    .then(()=>{
        alert("✅ বুকিং সফলভাবে Telegram এ পাঠানো হয়েছে");
        telegramForm.reset();
    })
    .catch(()=>{
        alert("❌ মেসেজ পাঠানো যায়নি");
    });
});
</script>

</body>
</html>
